id: ingest_item_1a
namespace: sec_filings.ingestion
description: Ingest one configured company's latest original 10-K Item 1A.
inputs:
  - {id: ticker, type: STRING, defaults: AAPL}
  - {id: item, type: STRING, defaults: 1A}
tasks:
  - id: ingest
    type: io.kestra.plugin.core.http.Request
    uri: http://app:8000/internal/ingestions
    method: POST
    contentType: application/json
    headers:
      Authorization: "Bearer {{ secret('INGESTION_API_TOKEN') }}"
    body: |
      {{ {"ticker": inputs.ticker, "item": inputs.item, "trigger": trigger is defined ? "schedule" : "manual"} | json }}
    options: {connectTimeout: PT10S, readTimeout: PT10M}
triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "{{ envs.ingestion_schedule }}"
