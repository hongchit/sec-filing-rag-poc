id: ingest_corpus
namespace: sec_filings.ingestion
description: Ingest the complete six-item corpus for all enabled companies or one selected ticker.
inputs:
  - id: target
    type: STRING
    defaults: all
tasks:
  - id: ingest
    type: io.kestra.plugin.core.http.Request
    uri: http://app:8000/internal/ingestions
    method: POST
    contentType: application/json
    headers:
      Authorization: "Bearer {{ secret('INGESTION_API_TOKEN') }}"
    body: |
      {{ {"target": trigger is defined ? "all" : inputs.target, "trigger": trigger is defined ? "schedule" : "manual", "kestra_execution_id": execution.id} | toJson }}
    options:
      connectTimeout: PT10S
      readTimeout: PT30M
triggers:
  - id: weekly
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "{{ envs.ingestion_schedule }}"
