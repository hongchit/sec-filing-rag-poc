apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app.kubernetes.io/name: sec-filing-rag-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sec-filing-rag-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sec-filing-rag-postgres
        app.kubernetes.io/part-of: sec-filing-rag-poc
    spec:
      securityContext:
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: ghcr.io/hongchit/sec-filing-rag-poc-postgres:bootstrap
          args:
            - postgres
            - -c
            - shared_preload_libraries=pg_textsearch
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sec-rag-postgres
                  key: POSTGRES_PASSWORD
            - name: APP_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: sec-rag-postgres
                  key: APP_DATABASE_NAME
            - name: APP_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: sec-rag-postgres
                  key: APP_DATABASE_USER
            - name: APP_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sec-rag-postgres
                  key: APP_DATABASE_PASSWORD
            - name: KESTRA_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: sec-rag-postgres
                  key: KESTRA_DATABASE_NAME
            - name: KESTRA_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: sec-rag-postgres
                  key: KESTRA_DATABASE_USER
            - name: KESTRA_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sec-rag-postgres
                  key: KESTRA_DATABASE_PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, postgres]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [pg_isready, -U, postgres]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: 750m
              memory: 768Mi
          securityContext:
            # The entrypoint fixes volume ownership, then drops to the postgres user.
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, FOWNER, DAC_OVERRIDE, SETUID, SETGID]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
