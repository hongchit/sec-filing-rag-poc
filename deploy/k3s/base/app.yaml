apiVersion: v1
kind: Service
metadata:
  name: app
spec:
  selector:
    app.kubernetes.io/name: sec-filing-rag-app
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 1
  # Release the old pod before replacement to stay within the single-node quota.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sec-filing-rag-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sec-filing-rag-app
        app.kubernetes.io/part-of: sec-filing-rag-poc
    spec:
      # Use DNS discovery; injected APP_PORT service links conflict with Settings.
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: initialize-evaluation
          image: ghcr.io/hongchit/sec-filing-rag-poc-app:bootstrap
          command: [sec-rag-production-evaluation, initialize]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: evaluation-data
              mountPath: /app/evaluation-data
        - name: migrate
          image: ghcr.io/hongchit/sec-filing-rag-poc-app:bootstrap
          command: [sec-rag-migrate]
          envFrom:
            - secretRef:
                name: sec-rag-app
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: app
          image: ghcr.io/hongchit/sec-filing-rag-poc-app:bootstrap
          envFrom:
            - secretRef:
                name: sec-rag-app
          env:
            - name: APP_HOST
              value: 0.0.0.0
            - name: APP_PORT
              value: "8000"
            - name: FRONTEND_DIST_PATH
              value: /app/frontend
            - name: PUBLIC_BASE_URL
              value: https://example.invalid
            - name: KESTRA_API_URL
              value: http://kestra:8080/api/v1/main
            - name: KESTRA_NAMESPACE
              value: sec_filings.ingestion
            - name: KESTRA_BATCH_FLOW_ID
              value: filing_batch
            - name: DATABASE_POOL_MIN_SIZE
              value: "1"
            - name: DATABASE_POOL_MAX_SIZE
              value: "4"
            - name: LOG_LEVEL
              value: INFO
            - name: RETRIEVAL_CONFIG_PATH
              value: /app/evaluation-data/active/config/retrieval.json
            - name: RETRIEVAL_EVALUATION_RESULT_PATH
              value: /app/evaluation-data/active/evaluation/results/retrieval-v1.json
            - name: RETRIEVAL_EVALUATION_DATASET_PATH
              value: /app/evaluation-data/active/evaluation/retrieval-v1.jsonl
            - name: RETRIEVAL_EVALUATION_MANIFEST_PATH
              value: /app/evaluation-data/active/evaluation/retrieval-v1-manifest.json
            - name: GENERATION_CONFIG_PATH
              value: /app/evaluation-data/active/config/generation.json
            - name: GENERATION_EVALUATION_RESULT_PATH
              value: /app/evaluation-data/active/evaluation/results/generation-v1.json
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 750m
              memory: 750Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: evaluation-data
              mountPath: /app/evaluation-data
      volumes:
        - name: tmp
          emptyDir: {}
        - name: evaluation-data
          persistentVolumeClaim:
            claimName: evaluation-data
