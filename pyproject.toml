[project]
name = "sec-filing-rag-poc"
version = "0.1.0"
description = "SEC filing ingestion and retrieval proof of concept"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.14"
dependencies = ["beautifulsoup4==4.13.4", "edgartools==5.41.0", "fastapi==0.116.1", "httpx==0.28.1", "openai==1.99.9", "psycopg[binary,pool]==3.2.10", "pydantic-settings==2.10.1", "pyyaml==6.0.2", "uvicorn[standard]==0.35.0"]
[dependency-groups]
dev = ["mypy==1.17.1", "pytest==8.4.1", "pytest-cov==6.2.1", "respx==0.22.0", "ruff==0.12.8", "types-pyyaml==6.0.12.20250822"]
[project.scripts]
sec-rag-api = "sec_filing_rag.main:run"
sec-rag-migrate = "sec_filing_rag.cli.migrate:main"
sec-rag-search = "sec_filing_rag.cli.retrieval:search_main"
sec-rag-evaluate-retrieval = "sec_filing_rag.cli.retrieval:evaluate_main"
sec-rag-generate-ground-truth = "sec_filing_rag.cli.ground_truth:main"
sec-rag-export-openapi = "sec_filing_rag.cli.generation:openapi_main"
sec-rag-generate-http = "sec_filing_rag.cli.generation:http_main"
[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/sec_filing_rag"]
[tool.ruff]
line-length = 100
target-version = "py314"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
[tool.mypy]
python_version = "3.14"
strict = true
packages = ["sec_filing_rag"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live_edgar: opt-in network regression tests against EdgarTools and SEC data"]
