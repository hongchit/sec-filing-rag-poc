openapi: 3.1.0
info:
  title: SEC Filing RAG
  version: 0.2.0
paths:
  /api/health:
    get:
      tags:
      - system
      summary: Health
      description: Check application database readiness.
      operationId: getHealth
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/auth/google/login:
    get:
      tags:
      - authentication
      summary: Google Login
      operationId: google_login_api_auth_google_login_get
      parameters:
      - name: return_to
        in: query
        required: false
        schema:
          type: string
          pattern: ^/(?:[^/].*)?$
          default: /research
          title: Return To
      - name: policy_acknowledged
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Policy Acknowledged
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/google/callback:
    get:
      tags:
      - authentication
      summary: Google Callback
      operationId: google_callback_api_auth_google_callback_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/auth/me:
    get:
      tags:
      - authentication
      summary: Me
      operationId: me_api_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Me Api Auth Me Get
      security:
      - SessionCookie: []
  /api/auth/logout:
    post:
      tags:
      - authentication
      summary: Logout
      operationId: logout_api_auth_logout_post
      responses:
        '204':
          description: Successful Response
      security:
      - SessionCookie: []
  /api/evaluation-overview/current:
    get:
      tags:
      - evaluation-overview
      summary: Current
      description: Read safe aggregate results and model provenance for the public portfolio overview.
      operationId: getCurrentEvaluationOverview
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationOverview'
  /api/showcase:
    get:
      tags:
      - showcase
      summary: Showcase
      description: Read optional, deployment-managed examples for the public landing page.
      operationId: getShowcase
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowcaseResponse'
  /api/retrieval-evaluations/current:
    get:
      tags:
      - retrieval-evaluations
      summary: Current
      description: Read the validated current retrieval evaluation and official leaderboard.
      operationId: getCurrentRetrievalEvaluation
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationSummary'
  /api/retrieval-evaluations/current/configurations/{configuration_id}/cases:
    get:
      tags:
      - retrieval-evaluations
      summary: Cases
      description: Inspect every reviewed question and ranked chunk for one stable configuration.
      operationId: getCurrentRetrievalEvaluationCases
      security:
      - SessionCookie: []
      parameters:
      - name: configuration_id
        in: path
        required: true
        schema:
          type: string
          title: Configuration Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationCases'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/retrieval-evaluations/current/chunks/{chunk_id}:
    get:
      tags:
      - retrieval-evaluations
      summary: Chunk
      description: Lazy-load full text and provenance for a chunk referenced by the current evaluation.
      operationId: getCurrentRetrievalEvaluationChunk
      security:
      - SessionCookie: []
      parameters:
      - name: chunk_id
        in: path
        required: true
        schema:
          type: string
          title: Chunk Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationChunk'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/generation-evaluations/current:
    get:
      tags:
      - generation-evaluations
      summary: Current
      description: Read the current portable generation evaluation summary.
      operationId: getCurrentGenerationEvaluation
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationEvaluationSummary'
  /api/generation-evaluations/current/cases:
    get:
      tags:
      - generation-evaluations
      summary: Cases
      description: Read question-by-prompt verdicts for the current generation evaluation.
      operationId: getCurrentGenerationEvaluationCases
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationEvaluationCases'
      security:
      - SessionCookie: []
  /api/generation-evaluations/current/questions/{case_id}:
    get:
      tags:
      - generation-evaluations
      summary: Question
      description: Compare every generated answer for one reviewed question.
      operationId: getCurrentGenerationEvaluationQuestion
      security:
      - SessionCookie: []
      parameters:
      - name: case_id
        in: path
        required: true
        schema:
          type: string
          title: Case Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationEvaluationQuestion'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/generation-evaluations/current/prompts/{prompt_id}:
    get:
      tags:
      - generation-evaluations
      summary: Prompt
      description: Read checksum-verified source for one evaluated prompt.
      operationId: getCurrentGenerationEvaluationPrompt
      security:
      - SessionCookie: []
      parameters:
      - name: prompt_id
        in: path
        required: true
        schema:
          type: string
          title: Prompt Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationPromptSource'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/generation-evaluations/current/chunks/{chunk_id}:
    get:
      tags:
      - generation-evaluations
      summary: Chunk
      description: Read optional database-backed evidence referenced by the generation run.
      operationId: getCurrentGenerationEvaluationChunk
      security:
      - SessionCookie: []
      parameters:
      - name: chunk_id
        in: path
        required: true
        schema:
          type: string
          title: Chunk Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationEvaluationChunk'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/companies:
    get:
      tags:
      - companies
      summary: Companies
      description: List configured companies and corpus readiness.
      operationId: listCompanies
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CompanySummary'
                type: array
                title: Response Listcompanies
      security:
      - SessionCookie: []
  /api/companies/{ticker}/status:
    get:
      tags:
      - companies
      summary: Company Status
      description: Inspect application-owned corpus status without querying Kestra.
      operationId: getCompanyStatus
      security:
      - SessionCookie: []
      parameters:
      - name: ticker
        in: path
        required: true
        schema:
          type: string
          title: Ticker
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyStatus'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/corpus/versions/{corpus_version_id}:
    get:
      tags:
      - corpus
      summary: Version
      operationId: getCorpusVersion
      security:
      - SessionCookie: []
      parameters:
      - name: corpus_version_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Corpus Version Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorpusVersion'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/corpus/versions/{corpus_version_id}/items/{item}:
    get:
      tags:
      - corpus
      summary: Item Document
      operationId: getCorpusItem
      security:
      - SessionCookie: []
      parameters:
      - name: corpus_version_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Corpus Version Id
      - name: item
        in: path
        required: true
        schema:
          enum:
          - '1'
          - 1A
          - '3'
          - '7'
          - 7A
          - '8'
          type: string
          title: Item
      - name: chunk_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^[0-9a-f]{64}$
          - type: 'null'
          title: Chunk Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorpusItemDocument'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/corpus/chunks/{chunk_id}/location:
    get:
      tags:
      - corpus
      summary: Chunk Location
      operationId: getCorpusChunkLocation
      security:
      - SessionCookie: []
      parameters:
      - name: chunk_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{64}$
          title: Chunk Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorpusChunkLocation'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/filing-batches:
    post:
      tags:
      - filing-workflows
      summary: Create Batch
      description: Submit all enabled companies or an explicit ordered ticker subset for latest or exact-year ingestion.
      operationId: createFilingBatch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilingBatchRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilingBatchAccepted'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - SessionCookie: []
  /api/companies/{ticker}/filing-preparations:
    post:
      tags:
      - filing-workflows
      summary: Create Preparation
      description: Submit one configured company for latest or exact fiscal-year ingestion.
      operationId: createCompanyFilingPreparation
      security:
      - SessionCookie: []
      parameters:
      - name: ticker
        in: path
        required: true
        schema:
          type: string
          title: Ticker
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilingPreparationRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilingBatchAccepted'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/filing-batches/{batch_id}:
    get:
      tags:
      - filing-workflows
      summary: Get Batch
      description: Read authoritative overall and per-company workflow status.
      operationId: getFilingBatch
      security:
      - SessionCookie: []
      parameters:
      - name: batch_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Batch Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilingBatchStatus'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/feedback:
    post:
      tags:
      - feedback
      summary: Save Feedback
      operationId: save_feedback_api_feedback_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackCreate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - SessionCookie: []
  /api/research:
    post:
      tags:
      - research
      summary: Create Research
      operationId: create_research_api_research_post
      security:
      - SessionCookie: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResearchCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/research/stream:
    post:
      tags:
      - research
      summary: Stream Research
      operationId: stream_research_api_research_stream_post
      security:
      - SessionCookie: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResearchCreate'
      responses:
        '200':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/research/history:
    get:
      tags:
      - research
      summary: Research History
      operationId: research_history_api_research_history_get
      security:
      - SessionCookie: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 20
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchHistory'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/research/{research_id}:
    get:
      tags:
      - research
      summary: Get Research
      operationId: get_research_api_research__research_id__get
      security:
      - SessionCookie: []
      parameters:
      - name: research_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Research Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/model-executions:
    get:
      tags:
      - administration
      summary: Model Executions
      operationId: model_executions_api_admin_model_executions_get
      security:
      - SessionCookie: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 25
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelExecutionPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/users:
    get:
      tags:
      - administration
      summary: Users
      operationId: users_api_admin_users_get
      security:
      - SessionCookie: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Search
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Users Api Admin Users Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/users/{user_id}/activity:
    get:
      tags:
      - administration
      summary: Activity
      operationId: activity_api_admin_users__user_id__activity_get
      security:
      - SessionCookie: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Activity Api Admin Users  User Id  Activity Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/admin/users/{user_id}:
    patch:
      tags:
      - administration
      summary: Update User
      operationId: update_user_api_admin_users__user_id__patch
      security:
      - SessionCookie: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                title: Response Update User Api Admin Users  User Id  Patch
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /internal/filing-batches/{batch_id}:
    get:
      tags:
      - internal-lifecycle
      summary: Get Execution Batch
      operationId: getFilingBatchExecution
      security:
      - InternalBearer: []
      parameters:
      - name: batch_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Batch Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilingBatchStatus'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /internal/filing-items/{item_id}/failures:
    post:
      tags:
      - internal-lifecycle
      summary: Fail Item
      description: Record a safe terminal item failure after an orchestration error.
      operationId: failFilingBatchItem
      security:
      - InternalBearer: []
      parameters:
      - name: item_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Item Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemFailureRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /internal/filing-batches/{batch_id}/finalizations:
    post:
      tags:
      - internal-lifecycle
      summary: Finalize
      description: Finalize aggregate state and fail any stranded running items.
      operationId: finalizeFilingBatch
      security:
      - InternalBearer: []
      parameters:
      - name: batch_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Batch Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchFinalizationRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /internal/filing-batches/{batch_id}/launch-failures:
    post:
      tags:
      - internal-lifecycle
      summary: Fail Launch
      description: Fail and reconcile a persisted batch whose processing subflow did not start.
      operationId: failFilingBatchLaunch
      security:
      - InternalBearer: []
      parameters:
      - name: batch_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Batch Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchLaunchFailureRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /internal/providers/filing-items/{item_id}/selection:
    post:
      tags:
      - internal-provider-execution
      summary: Select
      description: Select the latest original 10-K or an exact SEC report-date year.
      operationId: selectFilingForBatchItem
      security:
      - InternalBearer: []
      parameters:
      - name: item_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Item Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemExecutionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilingSelectionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /internal/providers/filing-items/{item_id}/acquisitions:
    post:
      tags:
      - internal-provider-execution
      summary: Acquire
      description: Validate and persist selected filing HTML; return only a safe acquisition reference.
      operationId: acquireSelectedFiling
      security:
      - InternalBearer: []
      parameters:
      - name: item_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Item Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemExecutionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcquisitionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /internal/corpus-executions/{item_id}:
    post:
      tags:
      - internal-corpus-execution
      summary: Process
      description: Build a corpus from a persisted acquisition and promote only in latest mode.
      operationId: executeCorpusForBatchItem
      security:
      - InternalBearer: []
      parameters:
      - name: item_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Item Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemExecutionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorpusExecutionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /internal/scheduled-filing-batches:
    post:
      tags:
      - internal-scheduled-ingestion
      summary: Create Scheduled Batch
      description: Persist an idempotent scheduler-owned batch for the shared Kestra processing flow.
      operationId: createScheduledFilingBatch
      security:
      - InternalBearer: []
      parameters:
      - name: X-Kestra-Execution-ID
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9._:-]+$
          title: X-Kestra-Execution-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilingBatchRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledFilingBatchCreated'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
